<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Subhadip | a063</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #08090A;
      color: #FAFAFA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 800px;
      width: 100%;
    }

    .intro {
      margin-bottom: 30px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      opacity: 0.7;
      filter: grayscale(0.3);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #8FC47B 40%, #6C5F54, #9D6136);
      -webkit-text-stroke: 1px #6ece4b;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-bottom: 0.1em;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #A3A3A3;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 12px 30px;
      background: #FAFAFA;
      color: #08090A;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .button:hover {
      transform: translateY(-1px);
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(250, 250, 250, 0.15);
    }

    #gameCanvas {
      background: #08090A;
      border: 2px solid hsl(0, 0%, 14.9%);
      border-radius: 10px;
      display: none;
      margin: 20px auto;
      max-width: 100%;
    }

    #gameCanvas.active {
      display: block;
    }

    .game-info {
      display: none;
      margin-top: 15px;
      color: #A3A3A3;
      font-size: 14px;
    }

    .game-info.active {
      display: block;
    }

    .score {
      font-size: 1.2rem;
      color: #8FC47B;
      margin-bottom: 10px;
    }

    .game-over {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: hsl(0, 0%, 14.9%);
      border-radius: 8px;
    }

    .game-over.active {
      display: block;
    }

    .game-over h2 {
      color: #8FC47B;
      margin-bottom: 10px;
    }

    .restart-btn {
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="intro" id="intro">
      <div class="icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. But don't worry, you can play a game while you wait!
      </p>
      <button class="button" id="startBtn">Play Dino 🦖</button>
    </div>

    <canvas id="gameCanvas" width="800" height="200"></canvas>
    
    <div class="game-info" id="gameInfo">
      <div class="score" id="score">Score: 0</div>
      <p id="instructions">Press SPACE or click to jump</p>
    </div>

    <div class="game-over" id="gameOver">
      <h2>Game Over!</h2>
      <div class="score" id="finalScore">Score: 0</div>
      <button class="button restart-btn" id="restartBtn">Play Again</button>
      <button class="button restart-btn" id="exitBtn" style="background: #585958; margin-left: 10px;">Exit Game</button>
    </div>
  </div>

  <!-- Game Logic Component -->
  <script src="/dino-game.js"></script>
</body>
</html>
