<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Subhadip | a063</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #08090A;
      color: #FAFAFA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      opacity: 0.7;
      filter: grayscale(0.3);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #8FC47B 40%, #6C5F54, #9D6136);
      -webkit-text-stroke: 1px #6ece4b;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-bottom: 0.1em;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #A3A3A3;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 12px 30px;
      background: #FAFAFA;
      color: #08090A;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(250, 250, 250, 0.15);
    }

    .cached-pages {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid hsl(0, 0%, 14.9%);
    }

    .cached-pages h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #FAFAFA;
    }

    .cached-pages ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cached-pages a {
      color: #A3A3A3;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid hsl(0, 0%, 14.9%);
      border-radius: 6px;
      transition: all 0.2s;
    }

    .cached-pages a:hover {
      color: #FAFAFA;
      background: hsl(0, 0%, 14.9%);
      border-color: hsl(0, 0%, 25%);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Don't worry, you can still browse cached pages from this portfolio.
    </p>
    <a href="/" class="button">Go to Home</a>

    <div class="cached-pages">
      <h2>Available Cached Pages</h2>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/blog">Blog</a></li>
      </ul>
    </div>
  </div>
</body>
</html>
